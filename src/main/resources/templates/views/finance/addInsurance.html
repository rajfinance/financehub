<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="form-container">
    <h1 th:text="${policy != null and policy.id != null} ? 'Edit Insurance' : 'Add Insurance'"></h1>
    <p class="fh-form-note">Static policy details. After login, due-soon policies appear as alerts on Home.</p>
    <form th:action="@{/api/finance/insurance/save}" th:object="${policy}" method="post" th:onsubmit="submitForm(event)">
        <div th:if="${successMessage != null}" class="form-banner form-banner--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage != null}" class="form-banner form-banner--error" th:text="${errorMessage}"></div>
        <input type="hidden" name="id" th:value="${policy?.id}" th:if="${policy != null and policy.id != null}"/>

        <div class="form-row">
            <div class="form-column">
                <div class="input-group">
                    <label for="policyName">Policy name<span class="mandatory">*</span></label>
                    <input type="text" id="policyName" name="policyName" th:value="${policy?.policyName}" required/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="insurerName">Insurer</label>
                    <input type="text" id="insurerName" name="insurerName" th:value="${policy?.insurerName}"/>
                </div>
            </div>
        </div>

        <div class="form-row form-row--3">
            <div class="form-column">
                <div class="input-group">
                    <label for="policyType">Type<span class="mandatory">*</span></label>
                    <select id="policyType" name="policyType" required>
                        <option th:each="t : ${policyTypes}" th:value="${t}" th:text="${t}"
                                th:selected="${policy != null and policy.policyType == t}"></option>
                    </select>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="premiumAmount">Premium<span class="mandatory">*</span></label>
                    <input type="number" step="0.01" min="0.01" id="premiumAmount" name="premiumAmount"
                           th:value="${policy?.premiumAmount}" required/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="premiumFrequency">Frequency<span class="mandatory">*</span></label>
                    <select id="premiumFrequency" name="premiumFrequency" required>
                        <option th:each="f : ${frequencies}" th:value="${f}" th:text="${f}"
                                th:selected="${policy != null and policy.premiumFrequency == f}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-column">
                <div class="input-group">
                    <label for="nextDueDate">Next due date<span class="mandatory">*</span></label>
                    <input type="date" id="nextDueDate" name="nextDueDate" th:value="${policy?.nextDueDate}" required/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="coverAmount">Cover amount</label>
                    <input type="number" step="0.01" id="coverAmount" name="coverAmount" th:value="${policy?.coverAmount}"/>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" th:text="${policy?.notes}"></textarea>
        </div>

        <button type="submit" th:text="${policy != null and policy.id != null} ? 'Update' : 'Save'"></button>
    </form>
</div>
</body>
</html>
