<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="form-container">
    <h1 th:text="${card != null and card.id != null} ? 'Edit Credit Card' : 'Add Credit Card'"></h1>
    <form th:action="@{/api/finance/cards/save}" th:object="${card}" method="post" th:onsubmit="submitForm(event)">
        <div th:if="${successMessage != null}" class="form-banner form-banner--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage != null}" class="form-banner form-banner--error" th:text="${errorMessage}"></div>
        <input type="hidden" name="id" th:value="${card?.id}" th:if="${card != null and card.id != null}"/>

        <div class="form-row">
            <div class="form-column">
                <div class="input-group">
                    <label for="cardName">Card name<span class="mandatory">*</span></label>
                    <input type="text" id="cardName" name="cardName" th:value="${card?.cardName}" required/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="bankName">Bank</label>
                    <select id="bankName" name="bankName">
                        <option value="">Select bank</option>
                        <option th:each="b : ${bankNames}" th:value="${b}" th:text="${b}"
                                th:selected="${card != null and card.bankName == b}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="cardNumber">Credit card number<span class="mandatory">*</span></label>
            <input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" autocomplete="off"
                   maxlength="23" placeholder="16-digit card number" th:value="${card?.cardNumber}" required/>
        </div>

        <div class="form-row form-row--3">
            <div class="form-column">
                <div class="input-group">
                    <label for="expiryMonth">Expiry month<span class="mandatory">*</span></label>
                    <select id="expiryMonth" name="expiryMonth" required>
                        <option value="">Month</option>
                        <option th:each="month, status : ${expiryMonths}"
                                th:value="${status.count}" th:text="${month}"
                                th:selected="${card != null and card.expiryMonth == status.count}"></option>
                    </select>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="expiryYear">Expiry year<span class="mandatory">*</span></label>
                    <select id="expiryYear" name="expiryYear" required>
                        <option value="">Year</option>
                        <option th:each="y : ${expiryYears}" th:value="${y}" th:text="${y}"
                                th:selected="${card != null and card.expiryYear == y}"></option>
                    </select>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="cvv">CVV<span class="mandatory">*</span></label>
                    <input type="text" id="cvv" name="cvv" inputmode="numeric" autocomplete="off"
                           maxlength="4" placeholder="3 or 4 digits" th:value="${card?.cvv}" required/>
                </div>
            </div>
        </div>

        <div class="form-row form-row--3">
            <div class="form-column">
                <div class="input-group">
                    <label for="creditLimit">Credit limit</label>
                    <input type="number" step="0.01" id="creditLimit" name="creditLimit" th:value="${card?.creditLimit}"/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="billingDay">Billing day (1–31)<span class="mandatory">*</span></label>
                    <input type="number" min="1" max="31" id="billingDay" name="billingDay"
                           th:value="${card?.billingDay}" required/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="dueDay">Due day (1–31)<span class="mandatory">*</span></label>
                    <input type="number" min="1" max="31" id="dueDay" name="dueDay"
                           th:value="${card?.dueDay}" required/>
                </div>
            </div>
        </div>

        <button type="submit" th:text="${card != null and card.id != null} ? 'Update' : 'Save'"></button>
    </form>
</div>
</body>
</html>
