<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="form-container">
    <h1>Add Ledger Entry</h1>
    <p class="fh-form-note">Credit increases balance; Debit decreases it. Use this when you move or spend cash — still fully manual.</p>
    <form th:action="@{/api/finance/ledger/save}" th:object="${entry}" method="post" th:onsubmit="submitForm(event)">
        <div th:if="${successMessage != null}" class="form-banner form-banner--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage != null}" class="form-banner form-banner--error" th:text="${errorMessage}"></div>

        <div class="form-row">
            <div class="form-column">
                <div class="input-group">
                    <label for="accountId">Account<span class="mandatory">*</span></label>
                    <select id="accountId" name="accountId" required>
                        <option value="">Select account</option>
                        <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.name + ' (' + a.accountType + ')'}"></option>
                    </select>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="entryType">Type<span class="mandatory">*</span></label>
                    <select id="entryType" name="entryType" required>
                        <option value="CREDIT" th:selected="${entry.entryType == 'CREDIT'}">Credit (+)</option>
                        <option value="DEBIT" th:selected="${entry.entryType == 'DEBIT'}">Debit (−)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-column">
                <div class="input-group">
                    <label for="entryDate">Date<span class="mandatory">*</span></label>
                    <input type="date" id="entryDate" name="entryDate" th:value="${entry.entryDate}" required/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="amount">Amount<span class="mandatory">*</span></label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount" required/>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="description">Description</label>
            <input type="text" id="description" name="description"/>
        </div>

        <button type="submit">Save entry</button>
    </form>
</div>
</body>
</html>
