<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="reportContent" class="fh-finance-report">
    <div class="fh-report-toolbar">
        <h1 class="h1report fh-report-title-plain"
            th:text="'Year-End Pack — ' + ${selectedYear}">Year-End Pack</h1>
        <div class="report-buttons fh-report-actions">
            <button id="printReport" class="print-btn" type="button" title="Print"><img th:src="@{/images/print.png}" alt="Print"/></button>
        </div>
    </div>
    <div class="fh-report-filters">
        <label for="yearEndYear">Year</label>
        <select id="yearEndYear"
                onchange="(function(sel){ var p=typeof getHubPanel==='function'?getHubPanel():null; if(!p)return; fetch('/api/finance/yearEndPackReport?year='+encodeURIComponent(sel.value),{credentials:'same-origin',headers:typeof getCsrfHeaders==='function'?getCsrfHeaders():{}}).then(function(r){return r.text();}).then(function(html){p.innerHTML=html; if(typeof attachReportListeners==='function') attachReportListeners(p,'yearEndPackReport');}); })(this)">
            <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                    th:selected="${selectedYear == y}"></option>
        </select>
    </div>

    <div class="fh-finance-summary-strip" th:if="${pack != null}">
        <div class="fh-finance-summary-chip fh-finance-summary-chip--net">
            <span>Net (inflows − outflows)</span>
            <strong th:text="${pack.formattedNet}">0</strong>
        </div>
    </div>

    <table class="summaryTable" th:if="${pack != null}">
        <thead>
        <tr>
            <th>Section</th>
            <th>Kind</th>
            <th class="fh-summary-total-col">Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${pack.sections}">
            <td th:text="${s.title}"></td>
            <td th:text="${s.inflow ? 'Inflow' : 'Outflow / estimate'}"></td>
            <td class="fh-summary-total-col" th:text="${s.formattedTotal}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
