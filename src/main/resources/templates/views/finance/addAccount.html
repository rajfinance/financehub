<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="form-container">
    <h1 th:text="${account != null and account.id != null} ? 'Edit Account' : 'Add Account'"></h1>
    <p class="fh-form-note">Balances are <strong>manual only</strong> — no bank login or paid sync. Update the balance yourself or via ledger credits/debits.</p>
    <form th:action="@{/api/finance/accounts/save}" th:object="${account}" method="post" th:onsubmit="submitForm(event)">
        <div th:if="${successMessage != null}" class="form-banner form-banner--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage != null}" class="form-banner form-banner--error" th:text="${errorMessage}"></div>

        <input type="hidden" name="id" th:value="${account?.id}" th:if="${account != null and account.id != null}"/>

        <div class="form-row">
            <div class="form-column">
                <div class="input-group">
                    <label for="name">Account name<span class="mandatory">*</span></label>
                    <input type="text" id="name" name="name" th:value="${account?.name}" required/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="accountType">Type<span class="mandatory">*</span></label>
                    <select id="accountType" name="accountType" required>
                        <option th:each="t : ${accountTypes}" th:value="${t}" th:text="${t}"
                                th:selected="${account != null and account.accountType == t}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-column">
                <div class="input-group">
                    <label for="bankName">Bank / institution</label>
                    <input type="text" id="bankName" name="bankName" th:value="${account?.bankName}"/>
                </div>
            </div>
            <div class="form-column">
                <div class="input-group">
                    <label for="accountMask">Account mask (e.g. ****1234)</label>
                    <input type="text" id="accountMask" name="accountMask" th:value="${account?.accountMask}"/>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="currentBalance">Current balance (you set this)<span class="mandatory">*</span></label>
            <input type="number" step="0.01" id="currentBalance" name="currentBalance"
                   th:value="${account?.currentBalance != null ? account.currentBalance : 0}" required/>
        </div>

        <div class="input-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" th:text="${account?.notes}"></textarea>
        </div>

        <button type="submit" th:text="${account != null and account.id != null} ? 'Update' : 'Save'"></button>
    </form>
</div>
</body>
</html>
