<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="reportContent" class="fh-finance-report">
    <div class="fh-report-toolbar">
        <h1 class="h1report fh-report-title-plain">Insurance</h1>
        <div class="report-buttons fh-report-actions">
            <button id="printReport" class="print-btn" type="button" title="Print"><img th:src="@{/images/print.png}" alt="Print"/></button>
        </div>
    </div>
    <th:block th:if="${policies != null and !policies.isEmpty()}">
        <table class="summaryTable">
            <thead>
            <tr>
                <th>Policy</th>
                <th>Insurer</th>
                <th class="fh-summary-total-col">Premium</th>
                <th>Next due</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="p : ${policies}">
                <tr>
                    <td>
                        <a href="javascript:void(0);" class="fh-report-link" onclick="toggleReportDetailRow(this)"
                           aria-expanded="false"
                           th:text="${p.policyNumber != null and !p.policyNumber.isEmpty()} ? ${p.policyNumber} : '—'"></a>
                    </td>
                    <td th:text="${p.insurerName != null ? p.insurerName : '—'}"></td>
                    <td class="fh-summary-total-col" th:text="${p.formattedPremium}"></td>
                    <td th:classappend="${p.dueUrgency == 'red'} ? ' fh-due-red' : (${p.dueUrgency == 'light'} ? ' fh-due-light-red' : '')"
                        th:text="${p.formattedDueDate}"></td>
                    <td>
                        <a href="javascript:void(0);" th:onclick="|loadEditPageContent('/api/finance/insurance/add?id=${p.id}')|"><img th:src="@{/images/edit-icon.png}" alt="Edit" style="width:20px;height:20px;"/></a>
                        <a href="javascript:void(0);"
                           th:attr="data-report-type='insuranceReport', data-id=${p.id}"
                           th:onclick="'deleteEntity(this, \'Insurance\', \'/api/finance/deleteInsurance\')'"><img th:src="@{/images/delete-icon.png}" alt="Delete" style="width:20px;height:20px;"/></a>
                    </td>
                </tr>
                <tr class="fh-report-detail-row" hidden>
                    <td colspan="5">
                        <div class="fh-report-detail">
                            <span><strong>Policy name:</strong>
                                <th:block th:text="${p.policyName != null ? p.policyName : '—'}"></th:block>
                            </span>
                            <span><strong>Type:</strong>
                                <th:block th:text="${p.policyType != null ? p.policyType : '—'}"></th:block>
                            </span>
                            <span><strong>Frequency:</strong>
                                <th:block th:text="${p.premiumFrequency != null ? p.premiumFrequency : '—'}"></th:block>
                            </span>
                            <span><strong>Commencement year:</strong>
                                <th:block th:text="${p.commencementYear != null ? p.commencementYear : '—'}"></th:block>
                            </span>
                            <span><strong>Maturity date:</strong>
                                <th:block th:text="${p.formattedMaturityDate}"></th:block>
                            </span>
                            <span><strong>Policy years:</strong>
                                <th:block th:text="${p.policyTermYears != null ? p.policyTermYears : '—'}"></th:block>
                            </span>
                            <span><strong>Payment years:</strong>
                                <th:block th:text="${p.premiumPaymentTermYears != null ? p.premiumPaymentTermYears : '—'}"></th:block>
                            </span>
                        </div>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </th:block>
    <p th:if="${policies == null or policies.isEmpty()}" class="fh-report-empty">No insurance policies yet.</p>
</div>
</body>
</html>
