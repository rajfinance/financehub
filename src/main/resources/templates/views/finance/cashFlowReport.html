<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="reportContent" class="fh-finance-report">
    <div class="fh-report-toolbar">
        <h1 class="h1report fh-report-title-plain"
            th:text="'Cash Flow — ' + ${selectedYear}">Cash Flow</h1>
        <div class="report-buttons fh-report-actions">
            <button id="printReport" class="print-btn" type="button" title="Print"><img th:src="@{/images/print.png}" alt="Print"/></button>
        </div>
    </div>
    <div class="fh-report-filters">
        <label for="cashFlowYear">Year</label>
        <select id="cashFlowYear"
                onchange="(function(sel){ var p=typeof getHubPanel==='function'?getHubPanel():null; if(!p)return; fetch('/api/finance/cashFlowReport?year='+encodeURIComponent(sel.value),{credentials:'same-origin',headers:typeof getCsrfHeaders==='function'?getCsrfHeaders():{}}).then(function(r){return r.text();}).then(function(html){p.innerHTML=html; if(typeof attachReportListeners==='function') attachReportListeners(p,'cashFlowReport');}); })(this)">
            <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                    th:selected="${selectedYear == y}"></option>
        </select>
    </div>

    <div class="fh-finance-summary-strip" th:if="${report != null}">
        <div class="fh-finance-summary-chip fh-finance-summary-chip--in">
            <span>Inflow</span>
            <strong th:text="${report.formattedInflow}">0</strong>
        </div>
        <div class="fh-finance-summary-chip fh-finance-summary-chip--out">
            <span>Outflow</span>
            <strong th:text="${report.formattedOutflow}">0</strong>
        </div>
        <div class="fh-finance-summary-chip fh-finance-summary-chip--net">
            <span>Net</span>
            <strong th:text="${report.formattedNet}">0</strong>
        </div>
    </div>

    <table class="summaryTable" th:if="${report != null}">
        <thead>
        <tr>
            <th>Line</th>
            <th>Direction</th>
            <th class="fh-summary-total-col">Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${report.lines}">
            <td th:text="${line.label}"></td>
            <td th:text="${line.inflow ? 'Inflow' : 'Outflow'}"></td>
            <td class="fh-summary-total-col" th:text="${line.formattedAmount}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
