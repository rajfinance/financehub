<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="reportContent" class="fh-finance-report">
    <div class="fh-report-toolbar">
        <h1 class="h1report fh-report-title-plain">Bank Accounts</h1>
        <div class="report-buttons fh-report-actions">
            <button id="printReport" class="print-btn" type="button" title="Print"><img th:src="@{/images/print.png}" alt="Print"/></button>
        </div>
    </div>
    <th:block th:if="${accounts != null and !accounts.isEmpty()}">
        <table class="summaryTable">
            <thead>
            <tr>
                <th>Display name</th>
                <th>Account number</th>
                <th>IFSC</th>
                <th class="fh-summary-total-col">Balance</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="a : ${accounts}">
                <tr>
                    <td>
                        <a href="javascript:void(0);" class="fh-report-link" onclick="toggleReportDetailRow(this)"
                           aria-expanded="false" th:text="${a.name}"></a>
                    </td>
                    <td th:text="${a.accountMask != null and !a.accountMask.isEmpty()} ? ${a.accountMask} : '—'"></td>
                    <td th:text="${a.ifscCode != null and !a.ifscCode.isEmpty()} ? ${a.ifscCode} : '—'"></td>
                    <td class="fh-summary-total-col" th:text="${a.formattedBalance}"></td>
                    <td>
                        <a href="javascript:void(0);" th:onclick="|loadEditPageContent('/api/finance/accounts/add?id=${a.id}')|">
                            <img th:src="@{/images/edit-icon.png}" alt="Edit" style="width:20px;height:20px;margin-right:12px;"/>
                        </a>
                        <a href="javascript:void(0);"
                           th:attr="data-report-type='accountsReport', data-id=${a.id}"
                           th:onclick="'deleteEntity(this, \'Bank account\', \'/api/finance/deleteAccount\')'">
                            <img th:src="@{/images/delete-icon.png}" alt="Delete" style="width:20px;height:20px;"/>
                        </a>
                    </td>
                </tr>
                <tr class="fh-report-detail-row" hidden>
                    <td colspan="5">
                        <div class="fh-report-detail">
                            <span><strong>Type:</strong> <th:block th:text="${a.accountType != null ? a.accountType : '—'}"></th:block></span>
                            <span><strong>Bank:</strong> <th:block th:text="${a.bankName != null ? a.bankName : '—'}"></th:block></span>
                            <span><strong>Home branch:</strong> <th:block th:text="${a.homeBranch != null and !a.homeBranch.isEmpty()} ? ${a.homeBranch} : '—'"></th:block></span>
                        </div>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </th:block>
    <p th:if="${accounts == null or accounts.isEmpty()}" class="fh-report-empty">No bank accounts yet. Add a bank account to get started.</p>
</div>
</body>
</html>
