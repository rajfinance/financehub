<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org"

      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<th:block sec:authorize="isAuthenticated()">

<div th:replace="~{views/common/header :: header(true)}"></div>

<th:block th:replace="~{views/common/menu :: appMainShell}"></th:block>

    <script th:src="@{/js/homeCharts.js}" src="/js/homeCharts.js"></script>

    <div class="container" data-page="dashboard" id="dashboardContent" data-chart-api="/api/home/chart-data">

        <div class="content-box">

            <h1 class="fh-dashboard-title">Welcome, <span class="fh-display-username" th:text="${displayFullName}">User</span></h1>

            <div class="fh-alerts" th:if="${financeAlerts != null and !financeAlerts.isEmpty()}" aria-label="Due soon alerts">
                <h2 class="fh-alerts__title">Reminders</h2>
                <ul class="fh-alerts__list">
                    <li th:each="alert : ${financeAlerts}"
                        class="fh-alert"
                        th:classappend="${alert.severity == 'danger'} ? ' fh-alert--danger' : ' fh-alert--warn'">
                        <span class="fh-alert__type" th:text="${alert.type == 'INSURANCE' ? 'Insurance' : 'Credit card'}"></span>
                        <strong class="fh-alert__title" th:text="${alert.title}"></strong>
                        <span class="fh-alert__detail" th:text="${alert.detail}"></span>
                    </li>
                </ul>
                <p class="fh-alerts__foot">
                    Manage in
                    <a href="javascript:void(0);" th:onclick="'loadContent(\'/api/finance/reports\')'">Finance</a>
                </p>
            </div>

            <div class="dashboard">

                <div class="fh-dashboard-kpis">

                    <div class="fh-kpi-card fh-kpi-card--salary">

                        <h3>Current Year Salary</h3>

                        <p th:text="${@formatterUtils.formatInIndianStyleWholeNumber(currentYearSalary)}">0</p>

                    </div>

                    <div class="fh-kpi-card fh-kpi-card--expense">

                        <h3>Current Year Expenses</h3>

                        <p th:text="${@formatterUtils.formatInIndianStyleWholeNumber(currentYearExpense)}">0</p>

                    </div>

                    <div class="fh-kpi-card fh-kpi-card--balance">

                        <h3>Net Balance</h3>

                        <p th:text="${@formatterUtils.formatInIndianStyleWholeNumber(currentYearNetBalance)}">0</p>

                    </div>

                    <div class="fh-kpi-card fh-kpi-card--rent">

                        <h3>Current Year Rent</h3>

                        <p th:text="${@formatterUtils.formatInIndianStyleWholeNumber(currentYearRent)}">0</p>

                    </div>

                    <div class="fh-kpi-card fh-kpi-card--emi">

                        <h3>Pending EMI This Year</h3>

                        <p id="kpiPendingEmi" class="fh-kpi-loading">…</p>

                    </div>

                </div>

                <div class="chart-row">

                    <div class="chart-container">

                        <canvas id="salaryExpenseChart"></canvas>

                    </div>

                    <div class="chart-container">

                        <canvas id="yearlySalaryChart"></canvas>

                    </div>

                    <div class="chart-container">

                        <canvas id="rentChart"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

</th:block>

<th:block sec:authorize="!isAuthenticated()">

    <p>Please log in to access your dashboard.</p>

</th:block>

</body>

</html>
