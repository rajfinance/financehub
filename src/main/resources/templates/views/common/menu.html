<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="menuGuestNoBar"></th:block>

<nav th:fragment="menuAuthNavList" class="app-primary-nav" aria-label="Application menu">
    <ul class="menu-items app-topbar-menu">
        <li class="menu-item"><a th:href="@{/api/home}">Home</a></li>
        <li class="menu-item">
            <a href="javascript:void(0);" th:onclick="'loadContent(\'/api/work/workReport\')'">Professional</a>
        </li>
        <li class="menu-item">
            <a href="javascript:void(0);" th:onclick="'loadContent(\'/api/expenses/yearWiseActualPlan\')'">Expenses</a>
        </li>
        <li class="menu-item">
            <a href="javascript:void(0);" th:onclick="'loadContent(\'/api/rent/reports\')'">Rentals</a>
        </li>
        <li class="menu-item">
            <a href="javascript:void(0);" th:onclick="'loadContent(\'/api/loan/reports\')'">Loans</a>
        </li>
        <li class="menu-item">
            <a href="javascript:void(0);" th:onclick="'loadContent(\'/api/account\')'">Profile</a>
        </li>
        <li class="menu-item menu-item-logout">
            <form th:action="@{/api/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="menu-logout-btn" title="Sign out" aria-label="Sign out">
                    <img class="menu-logout-icon" th:src="@{/images/signout.svg}" src="/images/signout.svg" alt="" width="18" height="18" loading="lazy" decoding="async"/>
                </button>
            </form>
        </li>
    </ul>
</nav>

<th:block th:fragment="menuShellEmpty"></th:block>

<th:block th:fragment="appMainShell">
    <div class="main-content" id="mainContent">
        <div id="username" style="display: none;" sec:authentication="name"></div>
        <div id="page-content"></div>
    </div>
</th:block>

<th:block th:fragment="menuBarOnly"></th:block>
</body>
</html>
