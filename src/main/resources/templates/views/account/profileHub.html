<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block sec:authorize="isAuthenticated()">
    <div class="fh-section-hub">
        <aside class="fh-section-hub__sidebar" aria-label="Profile menu">
            <div class="fh-section-hub__brand">
                <h1 class="fh-section-hub__title">Profile</h1>
            </div>
            <nav class="fh-section-hub__menu">
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-url="/api/account/profile"
                        onclick="showHubPage(this)">
                    Update Profile
                </button>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-url="/api/account/change-password"
                        onclick="showHubPage(this)">
                    Change Password
                </button>
            </nav>
        </aside>
        <div class="fh-section-hub__content">
            <div id="fhHubPanel" class="fh-section-hub__panel"></div>
        </div>
    </div>
</th:block>
<th:block sec:authorize="!isAuthenticated()">
    <p>Please log in to access this page.</p>
</th:block>
</body>
</html>
