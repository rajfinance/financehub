<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block sec:authorize="isAuthenticated()">
    <th:block th:if="${experienceGroups != null and not experienceGroups.isEmpty()}">
        <div id="reportContent" class="fh-exp-report">
            <div class="fh-report-toolbar">
                <h1 class="h1report fh-report-title-plain">Experience Report</h1>
                <div class="report-buttons fh-report-actions">
                    <button id="downloadPdf" class="pdf-btn" data-report="exp" title="Download PDF" aria-label="Download PDF">
                        <img th:src="@{/images/pdf.png}" src="/images/pdf.png" alt="PDF" />
                    </button>
                    <button id="printReport" class="print-btn" data-report="exp" title="Print" aria-label="Print">
                        <img th:src="@{/images/print.png}" src="/images/print.png" alt="Print" />
                    </button>
                </div>
            </div>

            <div class="fh-exp-total-card">
                <div class="fh-exp-total-card__label">Total Experience</div>
                <div class="fh-exp-total-stats">
                    <div class="fh-exp-stat fh-exp-stat--years">
                        <strong th:text="${expYears}">0</strong>
                        <span>Years</span>
                    </div>
                    <div class="fh-exp-stat fh-exp-stat--months">
                        <strong th:text="${expMonths}">0</strong>
                        <span>Months</span>
                    </div>
                    <div class="fh-exp-stat fh-exp-stat--days">
                        <strong th:text="${expDays}">0</strong>
                        <span>Days</span>
                    </div>
                </div>
            </div>

            <table class="fh-exp-summary-table">
                <thead>
                <tr>
                    <th>Company Name</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Experience</th>
                </tr>
                </thead>
                <tbody style="text-transform: capitalize;">
                <th:block th:each="group : ${experienceGroups}">
                    <tr>
                        <td style="text-align: left;">
                            <a href="javascript:void(0);"
                               class="fh-exp-company-link"
                               th:attr="data-group-key=${group.groupKey}"
                               onclick="toggleCompanyExpDetails(this.getAttribute('data-group-key'))"
                               th:text="${group.companyName}"></a>
                        </td>
                        <td style="text-align: left;" th:text="${group.formattedStartDate}"></td>
                        <td style="text-align: left;" th:text="${group.formattedEndDate}"></td>
                        <td style="text-align: left;" th:text="${group.experienceLabel}"></td>
                    </tr>
                    <tr th:id="|exp-detail-${group.groupKey}|" class="fh-exp-detail-row" style="display: none;">
                        <td colspan="4" class="fh-exp-detail-cell">
                            <table class="fh-exp-detail-table">
                                <thead>
                                <tr>
                                    <th>Client Name</th>
                                    <th>Project Name</th>
                                    <th>From Date</th>
                                    <th>To Date</th>
                                    <th>Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="entry : ${group.entries}">
                                    <td style="text-align: left;"
                                        th:text="${entry.clientName != null and !#strings.isEmpty(entry.clientName) ? entry.clientName : '-'}"></td>
                                    <td style="text-align: left;"
                                        th:text="${entry.projectName != null and !#strings.isEmpty(entry.projectName) ? entry.projectName : '-'}"></td>
                                    <td style="text-align: left;" th:text="${entry.formattedFromDate}"></td>
                                    <td style="text-align: left;"
                                        th:text="${entry.currentlyEmployed ? 'Currently Employed' : entry.formattedToDate}"></td>
                                    <td>
                                        <a href="javascript:void(0);"
                                           th:onclick="'loadEditPageContent(\'/api/work/addExperience?action=edit&id=' + ${entry.companyId} + '\')'"
                                           style="text-decoration: none;">
                                            <img th:src="@{/images/edit-icon.png}" src="/images/edit-icon.png" alt="Edit"
                                                 style="width: 20px; height: 20px; margin-right: 20px; margin-left: 15px;" />
                                        </a>
                                        <a href="javascript:void(0);" class="delete-btn"
                                           th:attr="data-report-type='expReport', data-id=${entry.companyId}"
                                           th:onclick="'deleteEntity(this, \'company\', \'/api/work/deleteExperience\')'">
                                            <img th:src="@{/images/delete-icon.png}" src="/images/delete-icon.png" alt="Delete"
                                                 style="width: 20px; height: 20px;" />
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </th:block>
    <th:block th:if="${experienceGroups == null or experienceGroups.isEmpty()}">
        <h2 class="fh-report-empty">No Companies Data Available.</h2>
    </th:block>
</th:block>
<th:block sec:authorize="!isAuthenticated()">
    <p>Please log in to access this page.</p>
</th:block>
</body>
</html>
