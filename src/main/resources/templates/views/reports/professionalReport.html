<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block sec:authorize="isAuthenticated()">
    <div class="fh-pro-reports">
        <aside class="fh-pro-reports__sidebar" aria-label="Professional report menu">
            <div class="fh-pro-reports__brand">
                <h1 class="fh-pro-reports__title">Professional</h1>
            </div>
            <nav class="fh-pro-reports__menu">
                <button type="button"
                        class="tab-button fh-pro-nav-item active"
                        onclick="showReport('expReport')">
                    Experience
                </button>
                <button type="button"
                        class="tab-button fh-pro-nav-item"
                        onclick="showReport('salaryReport')">
                    Salary
                </button>
            </nav>
        </aside>
        <div class="fh-pro-reports__content">
            <div class="tab-content fh-pro-reports__panel" id="expReport" style="display:none;"></div>
            <div class="tab-content fh-pro-reports__panel" id="salaryReport" style="display:none;"></div>
        </div>
    </div>
</th:block>
<th:block sec:authorize="!isAuthenticated()">
    <p>Please log in to access this page.</p>
</th:block>
</body>
</html>
