<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block sec:authorize="isAuthenticated()">
    <div class="fh-section-hub">
        <aside class="fh-section-hub__sidebar" aria-label="Professional menu">
            <div class="fh-section-hub__brand">
                <h1 class="fh-section-hub__title">Professional</h1>
            </div>
            <nav class="fh-section-hub__menu">
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-url="/api/work/addExperience?action=add"
                        onclick="showHubPage(this)">
                    Add Experience
                </button>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-url="/api/work/addSalary?action=add"
                        onclick="showHubPage(this)">
                    Add Salary
                </button>
                <div class="fh-hub-nav-label">Reports</div>
                <div class="fh-hub-nav-divider" role="separator"></div>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-report="expReport"
                        onclick="showHubReport(this)">
                    Experience
                </button>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-report="salaryReport"
                        onclick="showHubReport(this)">
                    Salary
                </button>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-report="companySalaryReport"
                        onclick="showHubReport(this)">
                    Company Salaries
                </button>
            </nav>
        </aside>
        <div class="fh-section-hub__content">
            <div id="fhHubPanel" class="fh-section-hub__panel"></div>
        </div>
    </div>
</th:block>
<th:block sec:authorize="!isAuthenticated()">
    <p>Please log in to access this page.</p>
</th:block>
</body>
</html>
