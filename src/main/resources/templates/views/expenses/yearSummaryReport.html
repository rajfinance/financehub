<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Year summary Expenses</title>
</head>
<body>
<div class="container">
    <div id="yearwise">
        <div class="fh-report-toolbar">
            <h1 class="h1report fh-report-title-plain"
                th:text="'YEARLY EXPENSE SUMMARY - ' + ${year}"></h1>
            <div class="report-buttons fh-report-actions">
                <button id="downloadPdf" class="pdf-btn"
                        type="button"
                        title="Download PDF" aria-label="Download PDF">
                    <img th:src="@{/images/pdf.png}" alt="PDF" />
                </button>
                <button id="printReport" class="print-btn"
                        type="button"
                        title="Print" aria-label="Print">
                    <img th:src="@{/images/print.png}" alt="Print" />
                </button>
            </div>
        </div>
        <div class="fh-summary-scroll">
        <table class="summaryTable">
            <thead>
            <tr>
                <th class="fh-sticky-col">Category</th>
                <th>JAN</th> <th>FEB</th> <th>MAR</th> <th>APR</th> <th>MAY</th>
                <th>JUN</th> <th>JUL</th> <th>AUG</th> <th>SEP</th> <th>OCT</th>
                <th>NOV</th> <th>DEC</th> <th class="fh-summary-total-col">TOTAL</th> <th class="fh-summary-avg-col">AVG</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${categorySums}">
                <td class="fh-sticky-col" th:text="${entry.key}"></td>
                <td th:each="month : ${#numbers.sequence(1, 12)}">
                    <span th:text="${expenseReport != null and expenseReport.size() > 0} ?
                        ${#numbers.formatInteger(
                            (expenseReport.?[category == '__${entry.key}__' and month == __${month}__].size() > 0)
                            ? expenseReport.?[category == '__${entry.key}__' and month == __${month}__].get(0).actualAmount
                            : 0, 0)}
                        : '0'" th:remove="tag"></span>
                </td>
                <td class="fh-summary-total-col"><strong th:text="${entry.value}"></strong></td>
                <td class="fh-summary-avg-col"><strong th:text="${categoryAverages[entry.key]}"></strong></td>
            </tr>
            <tr class="fh-report-footer-row">
                <td class="fh-sticky-col"><strong>Total</strong></td>
                <td th:each="month : ${#numbers.sequence(1, 12)}">
                    <strong th:text="${monthlySums[month.toString()] ?: '0'}"></strong>
                </td>
                <td class="fh-summary-total-col"><strong th:text="${grandTotal}"></strong></td>
                <td class="fh-summary-avg-col"><strong th:text="${totalAverage}"></strong></td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
</body>
</html>
