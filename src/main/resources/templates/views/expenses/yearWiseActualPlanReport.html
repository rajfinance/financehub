<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Year Wise Expenses</title>
</head>
<body>
<div class="container">
    <div id="yearwise">
        <h2 class="fh-plan-actual-title" th:text="'Budget & Actual Expenses For Year - ' + ${year}"></h2>
        <div class="fh-plan-actual-scroll">
        <table class="myTable">
            <thead>
            <tr>
                <th rowspan="2" class="fh-sticky-col">Category</th>
                <th th:each="monthName : ${#arrays.toStringArray('JAN,FEB,MAR,APR,MAY,JUN,JUL,AUG,SEP,OCT,NOV,DEC'.split(','))}"
                    th:text="${monthName}" colspan="2"></th>
            </tr>
            <tr>
                <th:block th:each="monthIndex : ${#numbers.sequence(1, 12)}">
                    <th th:text="'Budget'"></th>
                    <th th:text="'Actual'"></th>
                </th:block>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${#sets.toSet(reportData.![category])}">
                <td class="fh-sticky-col" th:text="${category}"></td>

                <th:block th:each="monthIndex : ${#numbers.sequence(1, 12)}">
                    <th:block th:with="
                        matches=${reportData.?[category == '__${category}__' and month == __${monthIndex}__]},
                        planAmt=${matches.size() > 0 ? matches.get(0).planAmount : 0},
                        actualAmt=${matches.size() > 0 ? matches.get(0).actualAmount : 0}">
                        <td th:text="${#numbers.formatInteger(planAmt, 0)}"></td>
                        <td th:classappend="${actualAmt > planAmt} ? ' fh-actual-over-budget' : ''"
                            th:text="${#numbers.formatInteger(actualAmt, 0)}"></td>
                    </th:block>
                </th:block>
            </tr>
            <tr class="fh-report-footer-row">
                <td class="fh-sticky-col">Total</td>
                <th:block th:each="monthIndex : ${#numbers.sequence(1, 12)}">
                    <td th:text="${monthlyPlanTotalMap[monthIndex.toString()] ?: '0'}"></td>
                    <td th:with="planRaw=${monthlyPlanTotals[monthIndex.toString()] ?: 0},
                                 actualRaw=${monthlyActualTotals[monthIndex.toString()] ?: 0}"
                        th:classappend="${actualRaw > planRaw} ? ' fh-actual-over-budget' : ''"
                        th:text="${monthlyActualTotalMap[monthIndex.toString()] ?: '0'}"></td>
                </th:block>
            </tr>

            </tbody>
        </table>
        </div>
    </div>
</div>
</body>
</html>
