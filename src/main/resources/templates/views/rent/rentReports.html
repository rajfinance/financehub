<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block sec:authorize="isAuthenticated()">
    <div class="fh-section-hub">
        <aside class="fh-section-hub__sidebar" aria-label="Rentals menu">
            <div class="fh-section-hub__brand">
                <h1 class="fh-section-hub__title">Rentals</h1>
            </div>
            <nav class="fh-section-hub__menu">
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-url="/api/rent/owners/add"
                        onclick="showHubPage(this)">
                    Add Owner
                </button>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-url="/api/rent/payments/add"
                        onclick="showHubPage(this)">
                    Add Rent
                </button>
                <div class="fh-hub-nav-label">Reports</div>
                <div class="fh-hub-nav-divider" role="separator"></div>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-report="ownersReport"
                        onclick="showHubReport(this)">
                    Owners
                </button>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-report="rentPaymentReport"
                        onclick="showHubReport(this)">
                    Rent Payments
                </button>
                <button type="button"
                        class="tab-button fh-hub-nav-item"
                        data-report="yearlyRentReport"
                        onclick="showHubReport(this)">
                    Yearly Rent
                </button>
            </nav>
        </aside>
        <div class="fh-section-hub__content">
            <div id="fhHubPanel" class="fh-section-hub__panel"></div>
        </div>
    </div>
</th:block>
<th:block sec:authorize="!isAuthenticated()">
    <p>Please log in to access this page.</p>
</th:block>
</body>
</html>
